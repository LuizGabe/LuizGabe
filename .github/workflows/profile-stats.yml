name: Update profile card

on:
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-stats
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Render public profile statistics
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/profile_stats.py
      - name: Commit updated cards
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/profile-stats-*.svg
          if ! git diff --cached --quiet; then
            git commit -m "docs(profile): update public profile statistics"
            git push
          fi
